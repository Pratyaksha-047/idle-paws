<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minesweeper · Idle Paws</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <nav class="back"><a href="../">← All games</a></nav>
    <header>
      <h1>Mines</h1>
      <div class="scores">
        <div class="score"><span>Mines</span><b id="left">0</b></div>
        <div class="score"><span>Time</span><b id="time">0</b></div>
        <div class="score"><span>Best</span><b id="best">–</b></div>
      </div>
    </header>
    <div class="actions">
      <select id="level" aria-label="Level">
        <option value="easy">Easy 9×9</option>
        <option value="medium">Medium 12×12</option>
        <option value="hard">Hard 16×16</option>
      </select>
      <button id="flag-mode" title="Flag mode (F)">🚩 Flag</button>
      <p class="hint">Right-click or hold to flag.</p>
      <button id="new" title="New game (N)">New game</button>
    </div>
    <div class="wrap">
      <div id="board" class="board"></div>
      <div id="paused" class="overlay hidden">
        <p>Paused</p>
        <div><button id="resume">Resume</button></div>
      </div>
      <div id="overlay" class="overlay hidden">
        <p id="overlay-text"></p>
        <div><button id="again">New game</button></div>
      </div>
    </div>
  </main>
  <script type="module" src="ui.js"></script>
</body>
</html>
