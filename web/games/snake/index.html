<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake · Idle Paws</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <nav class="back"><a href="../">← All games</a></nav>
    <header>
      <h1>Snake</h1>
      <div class="scores">
        <div class="score"><span>Score</span><b id="score">0</b></div>
        <div class="score"><span>Best</span><b id="best">0</b></div>
      </div>
    </header>
    <div class="actions">
      <p class="hint">Arrows / WASD / swipe. Space pauses.</p>
      <button id="new" title="New game (N)">New game</button>
    </div>
    <div class="wrap">
      <canvas id="board" class="board"></canvas>
      <div id="overlay" class="overlay">
        <p id="overlay-text">Press an arrow key to start</p>
        <div><button id="start">Start</button></div>
      </div>
    </div>
  </main>
  <script type="module" src="ui.js"></script>
</body>
</html>
