<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tetris · Claude Pets</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <nav class="back"><a href="../">← All games</a></nav>
    <header>
      <h1>Tetris</h1>
      <button id="new" title="New game (N)">New game</button>
    </header>
    <div class="play">
      <div class="wrap">
        <canvas id="board" class="board"></canvas>
        <div id="overlay" class="overlay">
          <p id="overlay-text">Ready?</p>
          <div><button id="start">Start</button></div>
        </div>
      </div>
      <aside>
        <div class="score"><span>Next</span><canvas id="next" class="next"></canvas></div>
        <div class="score"><span>Score</span><b id="score">0</b></div>
        <div class="score"><span>Lines</span><b id="lines">0</b></div>
        <div class="score"><span>Level</span><b id="level">1</b></div>
        <div class="score"><span>Best</span><b id="best">0</b></div>
      </aside>
    </div>
    <div class="controls">
      <button data-act="left" title="Left (←)">◀</button>
      <button data-act="rotate" title="Rotate (↑ / X)">⟳</button>
      <button data-act="right" title="Right (→)">▶</button>
      <button data-act="soft" title="Soft drop (↓)">▼</button>
      <button data-act="hard" title="Hard drop (Space)">⤓</button>
    </div>
    <p class="hint keys">← → move · ↑/X rotate · Z rotate back · ↓ soft · Space drop · P pause</p>
  </main>
  <script type="module" src="ui.js"></script>
</body>
</html>
