<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sudoku · Claude Pets</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <nav class="back"><a href="../">← All games</a></nav>
    <header>
      <h1>Sudoku</h1>
      <div class="scores">
        <div class="score"><span>Time</span><b id="time">0:00</b></div>
        <div class="score"><span>Mistakes</span><b id="mistakes">0</b></div>
      </div>
    </header>
    <div class="actions">
      <select id="difficulty" aria-label="Difficulty">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <p class="hint">Click a cell, type 1–9. Arrows move.</p>
      <button id="new" title="New game (N)">New game</button>
    </div>
    <div class="wrap">
      <div id="grid" class="grid" tabindex="0" aria-label="Sudoku grid"></div>
      <div id="paused" class="overlay hidden">
        <p>Paused</p>
        <div><button id="resume">Resume</button></div>
      </div>
      <div id="overlay" class="overlay hidden">
        <p id="overlay-text">Solved! 🎉</p>
        <div><button id="again">New game</button></div>
      </div>
    </div>
    <div id="pad" class="pad"></div>
  </main>
  <script type="module" src="ui.js"></script>
</body>
</html>
