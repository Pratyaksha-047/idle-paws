<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games · Idle Paws</title>
  <style>
    :root { --bg: #1f1e1d; --panel: #2a2927; --line: #3d3c38; --text: #ece9df; --muted: #a3a097; --accent: #d97757; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    main { width: min(640px, 100vw - 24px); margin: 14px auto 20px; }
    h1 { margin: 0 0 14px; font-size: 26px; letter-spacing: -0.5px; color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 16 / 10;
      border-radius: 22px;
      overflow: hidden;
      border: 3px solid var(--line);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      color: var(--text);
      text-decoration: none;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .card:hover, .card:focus-visible { transform: translateY(-2px) scale(1.015); border-color: var(--accent); outline: none; }
    .card .name {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 9px;
      font-size: clamp(15px, 4.2vw, 21px);
      font-weight: 800;
      letter-spacing: -0.3px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .card.has-image::after { content: ""; position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, rgba(0, 0, 0, 0.75)); }
    .card.has-image .name { z-index: 1; }
    /* No preview image: just the name, big, in the middle. */
    .card.name-only .name { position: static; padding: 0 14px; font-size: clamp(18px, 5.5vw, 26px); text-align: center;
      white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .empty { padding: 22px; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); line-height: 1.6; }
    .empty b { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <h1>🐾 Idle Paws games</h1>
    <div id="grid" class="grid"></div>
  </main>
  <script>
    // Cards for the user's game links (from the extension settings via /games.json):
    // the game's preview image when the site has one, otherwise just its name.
    const hue = (text) => [...text].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);

    const card = ({ name, url, image }) => {
      const link = new URL(url);
      const a = document.createElement('a');
      a.href = link.href;
      const h = hue(link.hostname);
      a.style.background = `linear-gradient(135deg, hsl(${h} 42% 34%), hsl(${(h + 40) % 360} 46% 20%))`;
      const title = document.createElement('span');
      title.className = 'name';
      title.textContent = name;
      const nameOnly = () => {
        a.className = 'card name-only';
        a.replaceChildren(title);
      };
      if (!image) {
        nameOnly();
        return a;
      }
      a.className = 'card has-image';
      const img = document.createElement('img');
      img.alt = '';
      img.onerror = nameOnly;
      img.src = image;
      a.append(img, title);
      return a;
    };

    const render = (games) => {
      const grid = document.getElementById('grid');
      if (!games.length) {
        grid.outerHTML = `<p class="empty"><b>No games yet.</b><br>Add links to games you like in
          Claude Desktop → Settings → Extensions → Idle Paws → Games.<br>
          Sites that work on a phone fit this side pane best.</p>`;
        return;
      }
      grid.append(...games.map(card));
    };

    fetch('/games.json')
      .then((response) => response.json())
      .then(({ games }) => render(games || []))
      .catch(() => render([]));
  </script>
</body>
</html>
