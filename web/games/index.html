<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games · Idle Paws</title>
  <style>
    :root { --bg: #1f1e1d; --panel: #2a2927; --line: #3d3c38; --text: #ece9df; --muted: #a3a097; --accent: #d97757; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    main { width: min(640px, 100vw - 24px); margin: 14px auto 20px; }
    h1 { margin: 0 0 14px; font-size: 26px; letter-spacing: -0.5px; color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 16 / 10;
      border-radius: 22px;
      overflow: hidden;
      border: 3px solid var(--line);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      color: var(--text);
      text-decoration: none;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .card:hover, .card:focus-visible { transform: translateY(-2px) scale(1.015); border-color: var(--accent); outline: none; }
    .card .name {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 9px;
      font-size: clamp(15px, 4.2vw, 21px);
      font-weight: 800;
      letter-spacing: -0.3px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .card.has-image::after { content: ""; position: absolute; inset: 45% 0 0; background: linear-gradient(transparent, rgba(0, 0, 0, 0.75)); }
    .card.has-image .name { z-index: 1; }
    /* No preview image: just the name, big, in the middle. */
    .card.name-only .name { position: static; box-sizing: border-box; width: 100%; padding: 0 16px; font-size: clamp(18px, 5.5vw, 26px);
      text-align: center; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .card .remove {
      position: absolute; top: 7px; right: 7px; z-index: 2; padding: 2px 8px; border: 0; border-radius: 999px;
      font: 600 12px/1.6 inherit; color: #fff; background: rgba(0, 0, 0, 0.45); cursor: pointer; opacity: 0.75;
    }
    .card .remove:hover { opacity: 1; }
    .card .remove.confirm { background: #c0392b; opacity: 1; }
    .add { border-style: dashed; background: transparent; color: var(--muted); font-size: 16px; font-weight: 700; cursor: pointer; }
    .add:hover { color: var(--text); }
    .hint { margin: 14px 2px 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    dialog { width: min(360px, 100vw - 32px); padding: 16px; border: 1px solid var(--line); border-radius: 16px;
      background: var(--panel); color: var(--text); }
    dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
    dialog h2 { margin: 0 0 12px; font-size: 17px; }
    dialog label { display: block; margin: 10px 0 4px; font-size: 12px; color: var(--muted); }
    dialog input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg);
      color: var(--text); font: inherit; }
    dialog input:focus { outline: none; border-color: var(--accent); }
    dialog .error { min-height: 18px; margin: 8px 0 0; color: #f08a7a; font-size: 12px; }
    dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    dialog button { padding: 7px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--text);
      font: inherit; cursor: pointer; }
    dialog button.primary { background: var(--accent); border-color: var(--accent); color: #1c1c1b; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>🐾 Idle Paws games</h1>
    <div id="grid" class="grid"></div>
    <p class="hint" id="hint">Add any game you like with + Add game (sites that work on a phone fit this pane best),
      remove one with ×, or just ask Claude to “add a game”.</p>
  </main>
  <dialog id="add-dialog">
    <form id="add-form" method="dialog">
      <h2>Add a game</h2>
      <label for="add-url">Link</label>
      <input id="add-url" name="url" placeholder="https://lichess.org/training" autocomplete="off" required>
      <label for="add-name">Name (optional)</label>
      <input id="add-name" name="name" placeholder="Chess puzzles" autocomplete="off">
      <p class="error" id="add-error"></p>
      <div class="buttons">
        <button type="button" id="add-cancel">Cancel</button>
        <button type="submit" class="primary">Add</button>
      </div>
    </form>
  </dialog>
  <script>
    // Cards for the user's games (/games.json): the game's preview image when the site has one,
    // otherwise just its name. Games can be added here (+ card) or removed (× twice) at any time.
    const hue = (text) => [...text].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);

    const card = ({ name, url, image }) => {
      const link = new URL(url);
      const a = document.createElement('a');
      a.href = link.href;
      const h = hue(link.hostname);
      a.style.background = `linear-gradient(135deg, hsl(${h} 42% 34%), hsl(${(h + 40) % 360} 46% 20%))`;
      const title = document.createElement('span');
      title.className = 'name';
      title.textContent = name;
      const remove = document.createElement('button');
      remove.className = 'remove';
      remove.title = `Remove ${name}`;
      remove.textContent = '×';
      remove.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        if (!remove.classList.contains('confirm')) {
          remove.classList.add('confirm');
          remove.textContent = 'Remove?';
          setTimeout(() => {
            remove.classList.remove('confirm');
            remove.textContent = '×';
          }, 3000);
          return;
        }
        update({ action: 'remove', url }).catch(() => {});
      });
      const nameOnly = () => {
        a.className = 'card name-only';
        a.replaceChildren(title, remove);
      };
      if (!image) {
        nameOnly();
        return a;
      }
      a.className = 'card has-image';
      const img = document.createElement('img');
      img.alt = '';
      img.onerror = nameOnly;
      img.src = image;
      a.append(img, title, remove);
      return a;
    };

    const addCard = () => {
      const button = document.createElement('button');
      button.className = 'card add';
      button.textContent = '+ Add game';
      button.addEventListener('click', openDialog);
      return button;
    };

    const render = (games) => {
      document.getElementById('grid').replaceChildren(...games.map(card), addCard());
    };

    const load = () =>
      fetch('/games.json')
        .then((response) => response.json())
        .then(({ games, enabled }) => {
          if (enabled === false) {
            document.getElementById('grid').replaceChildren();
            document.getElementById('hint').textContent =
              'Games are turned off. Turn on “Show games” in Claude Desktop → Settings → Extensions → Idle Paws.';
            return;
          }
          render(games || []);
        })
        .catch(() => render([]));

    // Add/remove go to the local overlay app; the response carries the updated list.
    const update = (change) =>
      fetch('/games', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(change) })
        .then((response) => response.json())
        .then((result) => {
          render(result.games || []);
          // Preview images are looked up in the background; pick them up shortly after adding.
          if (result.ok && change.action === 'add') setTimeout(load, 4000);
          return result;
        });

    const dialog = document.getElementById('add-dialog');
    const form = document.getElementById('add-form');
    const error = document.getElementById('add-error');

    function openDialog() {
      form.reset();
      error.textContent = '';
      dialog.showModal();
      document.getElementById('add-url').focus();
    }

    document.getElementById('add-cancel').addEventListener('click', () => dialog.close());
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const data = new FormData(form);
      update({ action: 'add', url: data.get('url'), name: data.get('name') })
        .then((result) => {
          if (result.ok) dialog.close();
          else error.textContent = `Couldn't add it: ${result.error}.`;
        })
        .catch(() => {
          error.textContent = "Couldn't reach Idle Paws. Is the pet running?";
        });
    });

    load();
  </script>
</body>
</html>
