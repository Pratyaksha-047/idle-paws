<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games · Idle Paws</title>
  <link rel="stylesheet" href="common.css">
  <style>
    main.menu { width: min(640px, 100vw - 24px); }
    .menu h1 { font-size: 26px; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card {
      position: relative;
      display: block;
      aspect-ratio: 16 / 10;
      border-radius: 22px;
      overflow: hidden;
      background: var(--panel) center / cover no-repeat;
      border: 3px solid var(--line);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      color: var(--text);
      text-decoration: none;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .card:hover, .card:focus-visible { transform: translateY(-2px) scale(1.015); border-color: var(--accent); outline: none; }
    .card span {
      position: absolute;
      left: 12px;
      top: 8px;
      font-size: clamp(15px, 4.2vw, 22px);
      font-weight: 800;
      letter-spacing: -0.3px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <main class="menu">
    <h1>🐾 Idle Paws games</h1>
    <div class="grid">
      <a class="card" href="2048/" style="background-image: url(thumbs/2048.svg)"><span>2048</span></a>
      <a class="card" href="sudoku/" style="background-image: url(thumbs/sudoku.svg)"><span>Sudoku</span></a>
      <a class="card" href="minesweeper/" style="background-image: url(thumbs/minesweeper.svg)"><span>Minesweeper</span></a>
      <a class="card" href="snake/" style="background-image: url(thumbs/snake.svg)"><span>Snake</span></a>
      <a class="card" href="tetris/" style="background-image: url(thumbs/tetris.svg)"><span>Tetris</span></a>
    </div>
  </main>
</body>
</html>
